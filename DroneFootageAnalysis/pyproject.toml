[project]
name = "sportsam"
version = "0.3.0"
description = "Use AI to analyze sports footage"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "decord>=0.6.0",
    "imageio>=2.37.0",
    "jaxtyping>=0.3.2",
    "matplotlib>=3.10.3",
    "opencv-python>=4.12.0.88",
    "pandas>=2.2.2",
    "sam2>=1.1.0",
]

[project.scripts]
sportsam = "sportsam.cmd.run_sportsam:main"

[dependency-groups]
dev = ["ipython>=9.3.0", "pytest>=8.4.1", "black"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sportsam"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "semver2"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true
